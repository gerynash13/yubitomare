name: Keep Supabase Alive

on:
  schedule:
    # Runs at 00:00 UTC every Tuesday and Friday
    - cron: '0 0 * * 2,5'
  workflow_dispatch: # Allows you to trigger it manually if needed

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/latest@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run script
        run: npx index.ts # Replace with your actual file name
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
